name: Sidecar

# Run by hand, it only proves that sidecar/patches still apply to 0 A.D.
# v0.28.0 and compile: nothing is uploaded, because an artifact on a public
# repo is a binary release. The release workflow calls it with upload set,
# and then it also stages a relocatable sidecar tree for the archives.
#
# It also runs on master when the sidecar changes, because a cache saved by a
# release tag is visible only to that tag, while one saved on master is
# visible to every tag: without this, each release rebuilds SpiderMonkey.
on:
  push:
    branches: [master]
    paths:
      - "sidecar/**"
      - ".github/workflows/sidecar.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Debian 12 is what upstream builds its own 0.28 Linux binaries on, so
    # the sidecar gets the same compiler and libraries as the players'
    # Linux clients.
    container: debian:bookworm-slim
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      # The engine has no LFS file it needs to compile, only game assets.
      GIT_LFS_SKIP_SMUDGE: "1"
      # premake5.lua keys its gcc 12 warning workaround on this exact name.
      CC: gcc-12
      CXX: g++-12
      MAKE: make
      RUSTUP_HOME: /usr/local/rust
      CARGO_HOME: /usr/local/rust
    steps:
      # Upstream's Debian 12 package list, minus audio, UPnP, Atlas
      # (wxWidgets) and clang, which the options below switch off. The
      # lobby stays: 0.28.0 includes gloox in its hardware report whether
      # or not the lobby is built, so --without-lobby does not compile. The
      # unversioned gcc and g++ are the same GCC 12, but they provide the
      # plain cc and c++ that Rust links with.
      - name: Install build dependencies
        run: |
          apt-get -qqy update
          apt-get install -qqy --no-install-recommends \
            ca-certificates curl git subversion make patch m4 xz-utils \
            pkg-config gcc g++ gcc-12 g++-12 llvm python3 python3-dev \
            python3-pip python-is-python3 libboost-filesystem-dev \
            libboost-system-dev libcurl4-gnutls-dev libenet-dev libfmt-dev \
            libfreetype-dev libgloox-dev libicu-dev libpng-dev libsdl2-dev \
            libsodium-dev libxml2-dev zlib1g-dev zstd git-lfs patchelf

      # The toolchain is pinned, so one saved copy serves every later run.
      - name: Restore Rust and cbindgen
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/rust
          key: sidecar-rust-1.76.0-cbindgen-0.29.0-debian12-${{ matrix.arch }}

      # Debian's Rust is too old for SpiderMonkey 128; these are the
      # versions upstream pins.
      - name: Install Rust and cbindgen
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.76.0
          "$CARGO_HOME/bin/cargo" install --locked cbindgen@0.29.0

      - name: Put Rust on PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Fetch 0 A.D. v0.28.0 and apply the sidecar patches
        run: |
          git clone --branch v0.28.0 --depth 1 https://gitea.wildfiregames.com/0ad/0ad.git
          cd 0ad
          for p in ../sidecar/patches/*.patch; do git apply "$p"; done

      # The patches never touch libraries/, so the built libraries depend
      # only on the 0 A.D. release and the build scripts, which the key
      # hashes. Each script finds its .already-built marker and skips.
      # Source tarballs are left out: nothing reads them once built.
      - name: Restore bundled libraries
        uses: actions/cache@v4
        with:
          path: |
            0ad/libraries/source/cxxtest-4.4
            0ad/libraries/source/fcollada
            0ad/libraries/source/premake-core
            0ad/libraries/source/spidermonkey
            !0ad/libraries/source/**/*.tar.*
          key: sidecar-libs-debian12-gcc12-${{ matrix.arch }}-${{ hashFiles('0ad/libraries/source/*/build.sh', '0ad/libraries/source/*/patches/**') }}

      # The library scripts are called one by one rather than through
      # build-source-libs.sh so NVTT is skipped, and SpiderMonkey runs with
      # OS=FreeBSD, the only way its script skips the debug copy it would
      # otherwise build next to the release one. Nothing else in that
      # script depends on the value on Linux.
      - name: Build bundled libraries
        working-directory: 0ad/libraries
        run: |
          export JOBS="-j$(nproc)"
          ./source/cxxtest-4.4/build.sh
          ./source/fcollada/build.sh
          # Premake names its own version after the git tag it is built at.
          # Its unpacked source is not a repository, so git would climb to
          # the 0 A.D. clone, which sits exactly on v0.28.0, and premake
          # would then call itself 0.28.0 and refuse the build scripts.
          GIT_CEILING_DIRECTORIES="$PWD/source/premake-core" \
            ./source/premake-core/build.sh
          OS=FreeBSD ./source/spidermonkey/build.sh
          cp source/spidermonkey/lib/* ../binaries/system/

      - name: Build pyrogenesis
        working-directory: 0ad
        run: |
          build/workspaces/update-workspaces.sh \
            --without-atlas --without-tests --without-audio \
            --without-miniupnpc --without-nvtt
          make -C build/workspaces/gcc config=release -j"$(nproc)"
          ls -l binaries/system/pyrogenesis

      # Only the map terrain is fetched from LFS: the rest of LFS is art,
      # audio and fonts, which a headless engine never loads.
      - name: Fetch map terrain
        if: inputs.upload
        working-directory: 0ad
        run: |
          git lfs install --local
          git lfs pull --include="binaries/data/mods/public/maps/**"

      # pyrogenesis looks for its data at ../data from its own directory
      # and for its libraries in $ORIGIN, so this tree runs from wherever it
      # is unpacked. Every library it links is bundled except the glibc
      # core, and each gets $ORIGIN too, because the executable's RUNPATH
      # does not apply to the dependencies of its dependencies. The media
      # left in the clone are LFS pointer stubs; they are dropped so the
      # tree holds no broken files.
      - name: Stage the sidecar
        if: inputs.upload
        run: |
          out="$PWD/stage/sidecar"
          sys="$out/binaries/system"
          mkdir -p "$sys"
          cd 0ad
          cp binaries/system/pyrogenesis binaries/system/libmozjs128-release.so \
            binaries/system/libCollada.so "$sys/"
          strip --strip-debug "$sys/pyrogenesis" "$sys/libmozjs128-release.so" \
            "$sys/libCollada.so"
          ldd "$sys/pyrogenesis" "$sys/libCollada.so" \
            | awk '$2 == "=>" && $3 ~ /^\// {print $3}' | sort -u \
            | while read -r lib; do
                name="$(basename "$lib")"
                case "$name" in
                  ld-linux*|libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*|libresolv.so.*|libutil.so.*) continue ;;
                esac
                [ -e "$sys/$name" ] || cp -L "$lib" "$sys/"
              done
          for lib in "$sys"/*.so*; do patchelf --set-rpath '$ORIGIN' "$lib"; done
          cp -a binaries/data "$out/binaries/data"
          rm -rf "$out/binaries/data/tests" "$out/binaries/data/tools" \
            "$out"/binaries/data/mods/_test.*
          git lfs ls-files -n | grep '^binaries/data/' \
            | grep -v '^binaries/data/mods/public/maps/' \
            | (cd "$out" && xargs -d '\n' rm -f --)
          cp LICENSE.md license_gpl-2.0.txt license_lgpl-2.1.txt license_mit.txt "$out/"
          cp -r ../sidecar/COPYING ../sidecar/LICENSE ../sidecar/patches "$out/"
          cat > "$out/SOURCE.txt" <<EOF
          This is 0 A.D. (Pyrogenesis) built from the official v0.28.0 release,
          https://gitea.wildfiregames.com/0ad/0ad/src/tag/v0.28.0
          with the patches in patches/ applied. Those patches are the complete
          set of changes. The build steps are .github/workflows/sidecar.yml in
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} at commit ${GITHUB_SHA}.

          binaries/data is the same release's game data without its art, audio
          and font files, which the headless engine does not load.
          EOF

      - name: Check that the bundle resolves its own libraries
        if: inputs.upload
        run: |
          sys="$PWD/stage/sidecar/binaries/system"
          ldd "$sys/pyrogenesis" "$sys/libCollada.so" > ldd.txt
          if grep -q "not found" ldd.txt; then cat ldd.txt; exit 1; fi
          outside="$(awk '$2 == "=>" && $3 ~ /^\// {print $3}' ldd.txt | sort -u \
            | grep -v "^$sys/" | xargs -r -n1 basename \
            | grep -vE '^(ld-linux|libc\.so|libm\.so|libdl\.so|libpthread\.so|librt\.so|libresolv\.so|libutil\.so)' || true)"
          if [ -n "$outside" ]; then echo "Resolved outside the bundle:"; echo "$outside"; exit 1; fi

      # upload-artifact drops the executable bit, so the tree travels as a
      # tarball.
      - name: Pack the sidecar
        if: inputs.upload
        run: tar -C stage -czf sidecar-linux-${{ matrix.arch }}.tar.gz sidecar

      - uses: actions/upload-artifact@v4
        if: inputs.upload
        with:
          name: sidecar-linux-${{ matrix.arch }}
          path: sidecar-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # The build container has every -dev package installed, so it cannot show
  # a library the bundle forgot. A bare Debian 12 can: the dynamic loader
  # runs before main, so reaching the missing-replay error proves it
  # resolved everything.
  smoke:
    if: inputs.upload
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-linux-${{ matrix.arch }}

      - name: Run the sidecar on a bare Debian 12
        run: |
          tar -xzf sidecar-linux-${{ matrix.arch }}.tar.gz
          # pyrogenesis refuses to start as root, which is the container default.
          # The runner's own uid has no passwd entry in the image, so HOME
          # would be "/", which it cannot write.
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/sidecar:/sidecar" debian:bookworm-slim \
            /sidecar/binaries/system/pyrogenesis -replay=/nonexistent/commands.txt \
            2>&1 | tee smoke.log
          grep -q "does not exist" smoke.log
