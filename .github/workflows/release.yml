name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Fails a tag in seconds, before the long builds, when Cargo.toml or
  # CHANGELOG.md was not prepared for it.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and extract the changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Cargo.toml version $cargo_version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          # A plain string match, so the dots and a -rc suffix need no escaping.
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > section.md
          if ! grep -q '[^[:space:]]' section.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          {
            cat section.md
            echo
            echo "---"
            echo
            cat <<'EOF'
          Works with 0 A.D. 0.28.0 clients.

          | Download | For |
          |---|---|
          | `x86_64-unknown-linux-musl` | Linux on x86_64, any distribution (static) |
          | `aarch64-unknown-linux-musl` | Linux on ARM64, any distribution (static) |
          | `x86_64-unknown-linux-gnu` | Linux on x86_64 with glibc |
          | `x86_64-pc-windows-msvc` | Windows 10/11 and Server, 64-bit |

          The Linux downloads also come as `-sidecar` archives, which add a
          ready-to-run sidecar (hosted AI, rejoin snapshots, match results):
          0 A.D. 0.28.0 with the patches in `sidecar/`, in the `sidecar`
          folder, and a `config.toml` that points the server at it: start
          `./veredus` from the archive folder.
          The sidecar needs glibc 2.36 or newer (Debian 12, Ubuntu 24.04 or
          later), also in the musl archives. There is no Windows sidecar
          yet. Its source is `sidecar/patches` and 0 A.D.'s v0.28.0 tag, see
          `sidecar/SOURCE.txt` in the archive.

          Docker images for x86_64 and ARM64:
          `ghcr.io/victorcrimea/veredus` and, with the sidecar,
          `ghcr.io/victorcrimea/veredus:latest-sidecar`.
          EOF
          } > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # cc-rs would look for an aarch64-linux-musl-gcc cross compiler; the
      # runner is native arm64, so plain musl-gcc is the right one.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'

      - name: Build
        env:
          # Links the C runtime into the exe, so it runs without the Visual
          # C++ redistributable installed.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }} --message-format=short

      - name: Check the binary
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/veredus"
          if [[ "${{ runner.os }}" == "Windows" ]]; then bin="$bin.exe"; fi
          if [[ "${{ matrix.target }}" == *musl ]]; then
            file "$bin"
            file "$bin" | grep -q "static"
          fi
          "$bin" --version

      - name: Package
        run: |
          set -euo pipefail
          name="veredus-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/veredus.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/veredus" "$name/"
            tar czf "$name.tar.gz" "$name"
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            veredus-*.tar.gz
            veredus-*.zip
            veredus-*.sha256

  sidecar:
    needs: notes
    uses: ./.github/workflows/sidecar.yml
    with:
      upload: true

  # The sidecar is a glibc program in its own directory, so one x64 build
  # serves both x64 server builds; Windows gets none. Each runs on its own
  # architecture because the packaged server writes the archive's config.
  package-sidecar:
    needs: [build, sidecar]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x64
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            arch: x64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: sidecar-linux-${{ matrix.arch }}

      - name: Package
        run: |
          set -euo pipefail
          plain="veredus-${GITHUB_REF_NAME}-${{ matrix.target }}"
          name="$plain-sidecar"
          tar xzf "$plain.tar.gz"
          mv "$plain" "$name"
          tar -C "$name" -xzf "sidecar-linux-${{ matrix.arch }}.tar.gz"
          # A plain ./veredus from the archive folder then runs with the
          # sidecar, since ./config.toml is loaded when present.
          "$name/veredus" --gen-config "$name/config.toml"
          sed -i 's|^pyrogenesis_path = ""$|pyrogenesis_path = "sidecar/binaries/system/pyrogenesis"|' \
            "$name/config.toml"
          grep -qx 'pyrogenesis_path = "sidecar/binaries/system/pyrogenesis"' "$name/config.toml"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-sidecar
          path: |
            veredus-*-sidecar.tar.gz
            veredus-*-sidecar.tar.gz.sha256

  docker:
    needs: [build, sidecar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-linux-musl
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: sidecar-linux-*
          merge-multiple: true

      # docker/Dockerfile picks each platform's files by Docker's own arch
      # names.
      - name: Prepare the build context
        run: |
          set -euo pipefail
          for pair in amd64:x86_64:x64 arm64:aarch64:arm64; do
            IFS=: read -r docker rust sidecar <<< "$pair"
            name="veredus-${GITHUB_REF_NAME}-${rust}-unknown-linux-musl"
            mkdir -p "ctx/$docker"
            tar xzf "$name.tar.gz"
            mv "$name/veredus" "ctx/$docker/veredus"
            tar -C "ctx/$docker" -xzf "sidecar-linux-$sidecar.tar.gz"
          done

      # The images only copy files in, but the package manager step still
      # runs as arm64.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: plain
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: sidecar
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-sidecar,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/Dockerfile
          target: plain
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.plain.outputs.tags }}
          labels: ${{ steps.plain.outputs.labels }}

      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/Dockerfile
          target: sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.sidecar.outputs.tags }}
          labels: ${{ steps.sidecar.outputs.labels }}

  release:
    needs: [notes, build, package-sidecar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes/notes.md
          files: |
            veredus-*.tar.gz
            veredus-*.zip
            veredus-*.sha256
