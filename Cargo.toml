[package]
name = "veredus"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Dedicated server for 0 A.D. multiplayer games"
repository = "https://github.com/victorcrimea/veredus"
readme = "README.md"

[profile.release]
strip = true
opt-level = 3
lto = true


[dependencies]
chrono = { version = "0.4.40", default-features = false, features = ["now"] }
hex = "0.4.3"
rocket = { version = "0.5", default-features = false, features = ["http2"] }
rusty_enet = { git = "https://github.com/victorcrimea/rusty_enet.git", rev = "a6749fbc6bec3c00e2359941eb5e2dfef6d4ec1f" }
serde = {version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-loki = { version = "0.2", default-features = false, features = ["compat-0-2-1", "rustls"] }
uuid = { version = "1.21.0", features = ["v4","v7"] }
futures = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.20"
argon2 = "0.6.0"
base64 = "0.22"
blake2 = "0.11.0"
sha2 = "0.11.0"
serde_json = "1"
tokio-xmpp = "5"
sasl = "0.5"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
toml = "1.1.6"
prometheus = { version = "0.13", features = ["process"] }
unicode-general-category = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
