[package]
name = "veredus"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
strip = true
opt-level = 3
lto = true


[dependencies]
chrono = { version = "0.4.40", default-features = false, features = ["now"] }
hex = "0.4.3"
rocket = { version = "0.5", default-features = false, features = ["http2"] }
rusty_enet = { git = "https://github.com/victorcrimea/rusty_enet.git", rev = "41d32876130653ab33fd6f503441ec5dae8cf000" }
serde = {version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-loki = { version = "0.2", default-features = false, features = ["compat-0-2-1", "rustls"] }
uuid = { version = "1.21.0", features = ["v4","v7"] }
futures = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.20"
argon2 = "0.6.0"
base64 = "0.22"
blake2 = "0.11.0"
sha2 = "0.11.0"
serde_json = "1"
tokio-xmpp = "5"
sasl = "0.5"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
toml = "1.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
